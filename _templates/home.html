<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{aesthetecoding.io} — field notes on Linux, dev environments &amp; the craft of the terminal</title>
<meta name="description" content="An aesthete's field notes on Linux, dev environments and the craft of the terminal.">
<!-- BUILD:HOME_SEO — canonical, OG, JSON-LD WebSite+Blog schema -->
{{HOME_SEO}}
<!-- fonts are self-hosted via @font-face in atelier.css — no third-party requests -->
<link rel="stylesheet" href="/css/atelier.css">
</head>
<body class="acx" data-theme="dark" data-eco="off" data-font="m">
<script>
/* anti-flash: apply saved preferences before the page paints */
(function () {
  try {
    var b = document.currentScript.parentElement, s = localStorage;
    var t = s.getItem('acx-theme'); if (t) b.setAttribute('data-theme', t);
    var f = s.getItem('acx-font');  if (f) b.setAttribute('data-font', f);
    var e = s.getItem('acx-eco');   if (e) b.setAttribute('data-eco', e);
  } catch (x) {}
})();
</script>

<!-- ===================== MASTHEAD ===================== -->
<header class="mast">
  <div class="mast-tools">
    <div class="seg theme" role="group" aria-label="Colour theme">
      <button data-v="light" aria-label="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
      <button data-v="dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z"></path></svg></button>
    </div>
    <div class="seg font" role="group" aria-label="Text size">
      <button data-v="s" aria-label="Small text">A</button>
      <button data-v="m" aria-label="Medium text">A</button>
      <button data-v="l" aria-label="Large text">A</button>
    </div>
    <button class="leaf" aria-label="Eco / performance mode" title="Eco / performance mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-8 6-14 16-15 0 10-6 16-16 15Z"></path><path d="M4 20c3-7 7-10 12-12"></path></svg></button>
  </div>

  <div class="wrap"><div class="mast-in">
    <img class="monk for-dark" src="/assets/logo-dark-bg.png" alt="aesthetecoding meditating monk logo" width="84">
    <img class="monk for-light" src="/assets/logo-light-bg.png" alt="aesthetecoding meditating monk logo" width="84">
    <h1 class="wordmark"><span class="b" aria-hidden="true">{</span>&nbsp;aesthetecoding.io&nbsp;<span class="b" aria-hidden="true">}</span></h1>
    <p class="punch" data-mode="slide">Easy to <span class="rot" data-words="learn,|code,|prompt,|pronounce,"><span class="w">learn,</span></span> hard to <span class="rot" data-words="master.|master.|master.|write."><span class="w">master.</span></span></p>
    <!-- BUILD:TOPICS_NAV — generated from _config/categories.json, ordered by post count -->
    <nav class="mast-topics" aria-label="Filter by topic">
      {{TOPICS_NAV}}
    </nav>
  </div></div>
</header>

<main class="wrap">

  <!-- ===================== FEATURED ===================== -->
  <!-- BUILD:FEATURED_SECTION — article with featured:true in meta.json, else most recent -->
  {{FEATURED_SECTION}}

  <!-- ===================== ALL WRITING ===================== -->
  <div class="sec"><h2>All writing</h2><span class="ct">{{ARTICLE_COUNT}} posts</span><span class="rule"></span></div>

  <!-- ===================== POST LIST ===================== -->
  <!-- BUILD:ARTICLES_LIST — generated from _articles/*/meta.json, newest first -->
  <div class="list">
    {{ARTICLES_LIST}}
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="foot">
    <nav class="foot-social" aria-label="External links">
      <a href="https://github.com/Fred-el-Jolo" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.94.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"></path></svg></a>
      <a href="https://www.linkedin.com/in/fredericguillaume/" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.5c0-1.31-.02-3-1.83-3-1.83 0-2.11 1.43-2.11 2.9V21H9z"></path></svg></a>
    </nav>
    <div class="foot-text">
      <span class="fpunch">Easy to code, hard to master.</span>
      <span><span class="b">{</span> aesthetecoding.io <span class="b">}</span> · © 2026 · built static, served with care</span>
    </div>
  </footer>

</main>

<script src="/js/atelier.js"></script>
</body>
</html>
