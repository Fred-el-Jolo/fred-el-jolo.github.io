<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{aesthetecoding.io} — field notes on AI, code, systems &amp; the craft of the terminal</title>
<meta name="description" content="An aesthete's field notes on AI, code, systems and the craft of the terminal.">
<!-- BUILD:HOME_SEO — canonical, OG, JSON-LD WebSite+Blog schema -->
{{HOME_SEO}}
<!-- fonts are self-hosted via @font-face in atelier.css — no third-party requests -->
<link rel="stylesheet" href="/css/atelier.css">
</head>
<body class="acx" data-theme="dark" data-eco="off" data-font="m">
<!-- BUILD:ANTI_FLASH — inline boot snippet from build.ts (must stay inline to avoid a flash) -->
{{ANTI_FLASH}}

<!-- ===================== MASTHEAD ===================== -->
<header class="mast">
  <!-- BUILD:MAST_TOOLS — theme / font / eco toggles from build.ts -->
  {{MAST_TOOLS}}

  <div class="wrap"><div class="mast-in">
    <img class="monk for-dark" src="/assets/logo-dark-bg.png" alt="aesthetecoding meditating monk logo" width="84">
    <img class="monk for-light" src="/assets/logo-light-bg.png" alt="aesthetecoding meditating monk logo" width="84">
    <h1 class="wordmark"><span class="b" aria-hidden="true">{</span>&nbsp;aesthetecoding.io&nbsp;<span class="b" aria-hidden="true">}</span></h1>
    <p class="punch" data-mode="slide">Easy to <span class="rot" data-words="learn,|code,|prompt,|pronounce,|start,|demo,|copy,|scaffold,|generate,|automate,|quote,|type,|ship,|scale,|install,|merge,|write,"><span class="w">learn,</span></span> hard to <span class="rot" data-words="unlearn.|read.|verify.|spell.|finish.|deploy.|explain.|be proud of.|trust.|explain.|check.|name.|own.|simplify.|maintain.|review.|delete."><span class="w">unlearn.</span></span></p>
    <!-- BUILD:TOPICS_NAV — generated from _config/categories.json, ordered by post count -->
    <nav class="mast-topics" aria-label="Filter by topic">
      {{TOPICS_NAV}}
    </nav>
  </div></div>
</header>

<main class="wrap">

  <!-- ===================== FEATURED ===================== -->
  <!-- BUILD:FEATURED_SECTION — article with featured:true in meta.json, else most recent -->
  {{FEATURED_SECTION}}

  <!-- ===================== ALL WRITING ===================== -->
  <div class="sec"><h2>All articles</h2><span class="ct">{{ARTICLE_COUNT}} articles</span><span class="rule"></span></div>

  <!-- ===================== POST LIST ===================== -->
  <!-- BUILD:ARTICLES_LIST — generated from _articles/*/meta.json, newest first -->
  <div class="list">
    {{ARTICLES_LIST}}
    <p class="list-empty">Nothing published here yet — new field notes landing soon.</p>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <!-- BUILD:FOOTER — social links + text line, generated from _config/site.json -->
  <footer class="foot">{{FOOTER}}</footer>

</main>

<script src="/js/atelier.js"></script>
</body>
</html>
