<!DOCTYPE html>
<!--
  Production template for slide-format articles (meta.json "format": "deck").
  Rendered by _scripts/build.ts from _articles/{slug}/slides.html — NOT the same
  file as _templates/article-deck.html (that one's the browsable slide catalogue;
  this one is the minimal page shell + SEO head, wired into the build pipeline).
  Slide markup/component reference: _templates/article-deck.html
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* anti-flash: apply saved theme before paint — shares the site's acx-theme key */
(function () {
  try {
    var t = localStorage.getItem('acx-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (x) {}
})();
</script>
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<!-- BUILD:HEAD_SEO — canonical, OG, Twitter card, JSON-LD injected here -->
{{HEAD_SEO}}
<link rel="stylesheet" href="/css/deck.css">
</head>
<body>

<deck-stage data-back-href="/">
<!-- BUILD:DECK_SLIDES — content from _articles/{slug}/slides.html -->
{{DECK_SLIDES}}
</deck-stage>

<!-- no-JS fallback: deck-stage never defines without JavaScript, and the
     stylesheet hides its slides — unhide them stacked as a readable page -->
<noscript>
  <style>
    deck-stage:not(:defined){ visibility:visible; position:static; overflow:visible; background:var(--paper); }
    deck-stage:not(:defined) > section.slide{ position:static; display:flex; visibility:visible; opacity:1; height:auto; }
    deck-stage:not(:defined) .slide--photo{ position:relative; }
  </style>
</noscript>

<script src="/js/deck-stage.js"></script>
</body>
</html>
