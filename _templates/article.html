<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<!-- BUILD:HEAD_SEO — canonical, OG, Twitter card, JSON-LD injected here -->
{{HEAD_SEO}}
<!-- fonts are self-hosted via @font-face in atelier.css — no third-party requests -->
<link rel="stylesheet" href="/css/atelier.css">
<link rel="stylesheet" href="/css/prose.css">
</head>
<body class="acx" data-theme="dark" data-eco="off" data-font="m">
<!-- BUILD:ANTI_FLASH — inline boot snippet from build.ts (must stay inline to avoid a flash) -->
{{ANTI_FLASH}}

<!-- ===================== READING-VIEW HEADER ===================== -->
<header class="rbar"><div class="wrap"><div class="rbar-in">
  <a class="brand" href="/">
    <img class="for-dark" src="/assets/logo-dark-bg.png" alt="" width="42">
    <img class="for-light" src="/assets/logo-light-bg.png" alt="" width="42">
    <span class="wm"><span class="b">{</span> aesthetecoding.io <span class="b">}</span></span>
  </a>
  <span class="sp"></span>
  <!-- BUILD:MAST_TOOLS — theme / font / eco toggles from build.ts -->
  {{MAST_TOOLS}}
</div></div></header>

<!-- ===================== ARTICLE ===================== -->
<article class="read">
  <div class="rhead">
    <a class="back" href="/">← all articles</a>
    <!-- BUILD:KICK — category dot + label -->
    <p class="kick"><span class="cat-chip" style="--cat:var({{KICK_COLOR}})">{{KICK_LABEL}}</span></p>
    <h1>{{ARTICLE_TITLE}}</h1>
    <div class="byl">
      <span>{{BYLINE_AUTHOR}}</span>
      <span>{{BYLINE_DATE}}</span>
      <span>·</span>
      <span>{{BYLINE_READTIME}}</span>
    </div>
    <!-- BUILD:PROVENANCE — prov-none | prov-enriched | prov-full -->
    {{PROVENANCE_BADGE}}
  </div>

  <!-- BUILD:COVER_SECTION — hero image + eco caption (omitted when no cover) -->
  {{COVER_SECTION}}

  <div class="col">
    <!-- BUILD:BODY — content from _articles/{slug}/content.html -->
    {{ARTICLE_BODY}}
  </div>

  <!-- end-of-article colophon -->
  <div class="colo"><div class="colo-card"><div class="colo-lock">
    <p class="big">Read with intention.</p>
    <p class="sub">aesthete + coding</p>
    <img class="wm-monk for-dark" src="/assets/monk-cream.png" alt="" width="104">
    <img class="wm-monk for-light" src="/assets/monk-ink.png" alt="" width="104">
  </div></div></div>
</article>

<!-- ===================== FOOTER ===================== -->
<!-- BUILD:FOOTER — social links + text line, generated from _config/site.json -->
<footer class="foot wrap">{{FOOTER}}</footer>

<script src="/js/atelier.js"></script>
<script src="/js/vendor/sketch-annotate.js"></script>
<script src="/js/prose.js"></script>
</body>
</html>
